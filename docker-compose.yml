version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: meowsica-redis
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
    driver: local


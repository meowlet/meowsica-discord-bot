services:
  bot:
    build: .
    container_name: meowsica-bot
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ENABLE_SHARDING=true
      - SHARD_COUNT=3
      - ENABLE_REDIS=true
      - REDIS_URL=redis://redis:6379
    networks:
      - meowsica-network
    volumes:
      - bot-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1400M
        reservations:
          cpus: '0.5'
          memory: 600M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.2-alpine
    container_name: meowsica-redis
    restart: always
    volumes:
      - redis-data:/data
    command: >
      redis-server 
      --appendonly yes
      --maxmemory 80mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --tcp-keepalive 60
      --timeout 300
    networks:
      - meowsica-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 112M
        reservations:
          cpus: '0.1'
          memory: 48M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  meowsica-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  bot-data:
    driver: local
